<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP — Physical Three-Word Instruments</title>
  <meta name="description" content="A vertical snap-scroll feed of quiet physical M·C·P instruments celebrating MCP's second birthday." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151514'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='32' fill='%23F2EDE4'%3EM%3C/text%3E%3Ccircle cx='49' cy='17' r='4.5' fill='%23C94824'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#top" class="brand" id="brandLink" title="Back to first instrument">
      <span class="brand-mark">
        <span class="brand-dot" aria-hidden="true"></span>
        MCP
      </span>
      <span class="brand-sub">Instruments</span>
    </a>

    <nav class="nav-actions" aria-label="Controls">
      <button
        type="button"
        class="nav-btn"
        id="soundToggle"
        aria-pressed="false"
        title="Toggle physical sound (S)"
      >
        <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <span id="soundLabel">Muted</span>
      </button>

      <button
        type="button"
        class="nav-btn"
        id="indexToggle"
        aria-expanded="false"
        aria-controls="indexDrawer"
        title="Browse all phrases (/)"
      >
        <span>Index</span>
        <span class="count-pill" id="totalCount">64</span>
      </button>

      <button
        type="button"
        class="nav-btn"
        id="themeToggle"
        aria-label="Toggle color theme"
        title="Switch light/dark theme (T)"
      >
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </button>
    </nav>
  </header>

  <main class="feed" id="feed" aria-label="MCP instruments feed"></main>

  <nav class="feed-rail" id="feedRail" aria-label="Instrument navigation"></nav>

  <!-- Preserved / Index Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
  <aside class="drawer" id="indexDrawer" aria-label="All MCP expansions" aria-hidden="true">
    <div class="drawer-head">
      <h2 class="drawer-title">All Expansions</h2>
      <button type="button" class="drawer-close" id="drawerClose">Esc</button>
    </div>

    <div class="drawer-toolbar">
      <input
        type="search"
        class="search-input"
        id="searchInput"
        placeholder="Filter phrases or notes…"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="filter-row" role="group" aria-label="Filter by category">
        <button type="button" class="filter-pill" data-cat="all" aria-pressed="true">All</button>
        <button type="button" class="filter-pill" data-cat="birthday" aria-pressed="false">Birthday</button>
        <button type="button" class="filter-pill" data-cat="protocol" aria-pressed="false">Protocol</button>
        <button type="button" class="filter-pill" data-cat="dev" aria-pressed="false">Dev</button>
        <button type="button" class="filter-pill" data-cat="absurd" aria-pressed="false">Absurd</button>
      </div>
    </div>

    <div class="drawer-list" id="drawerList" role="list"></div>

    <div class="drawer-foot">
      <span>Community list in <code>phrases.json</code></span>
      <span id="drawerShowing">64 entries</span>
    </div>
  </aside>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
