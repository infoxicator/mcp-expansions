<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP — Physical Three-Word Instruments</title>
  <meta name="description" content="A vertical snap-scroll feed of quiet physical M·C·P instruments celebrating MCP's second birthday." />
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/brand/mcp-favicon.svg" />
  <link rel="stylesheet" href="./src/styles.css" />
  <!-- The feed and its mechanism runtime share a version to invalidate cached modules together. -->
  <script type="importmap">
    {
      "imports": {
        "mcp-registry": "./src/registry.js?v=4",
        "mcp-feed-scroll": "./src/core/feed-scroll.js?v=4",
        "mcp-mechanism": "./src/core/mechanism.js?v=4",
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/jsm/"
      }
    }
  </script>
</head>
<body>
  <span class="mcp-mark" role="img" aria-label="Model Context Protocol"></span>
  <main class="feed" id="feed" tabindex="-1" aria-label="MCP instruments feed"></main>
  <nav class="instrument-rail" id="instrumentRail" aria-label="Instrument navigation">
    <div class="instrument-rail-track"></div>
    <button class="instrument-preview" type="button" tabindex="-1" hidden>
      <img alt="" width="154" height="154" />
    </button>
  </nav>
  <div class="scroll-cue">
    <span class="scroll-cue-mark" id="scrollCueMark" aria-hidden="true">
      <span class="scroll-cue-arrow"></span>
    </span>
    <span class="scroll-cue-keyboard">scroll · press j / k</span>
    <span class="scroll-cue-touch">swipe up</span>
  </div>
  <span class="action-status" id="actionStatus" role="status"></span>

  <!-- Preserved / Index Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
  <aside class="drawer" id="indexDrawer" inert role="dialog" aria-modal="true" aria-label="All MCP expansions" aria-hidden="true">
    <div class="drawer-head">
      <h2 class="drawer-title">All Expansions</h2>
      <button type="button" class="drawer-close" id="drawerClose">Esc</button>
    </div>

    <div class="drawer-toolbar">
      <input
        type="search"
        class="search-input"
        id="searchInput" aria-label="Filter phrases or notes"
        placeholder="Filter phrases or notes…"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="filter-row" role="group" aria-label="Filter by category">
        <button type="button" class="filter-pill" data-cat="all" aria-pressed="true">All</button>
        <button type="button" class="filter-pill" data-cat="birthday" aria-pressed="false">Birthday</button>
        <button type="button" class="filter-pill" data-cat="protocol" aria-pressed="false">Protocol</button>
        <button type="button" class="filter-pill" data-cat="dev" aria-pressed="false">Dev</button>
        <button type="button" class="filter-pill" data-cat="absurd" aria-pressed="false">Absurd</button>
        <button type="button" class="filter-pill" data-cat="skeptic" aria-pressed="false">Skeptic</button>
      </div>
    </div>

    <div class="drawer-list" id="drawerList" aria-label="Matching phrases"></div>

    <div class="drawer-foot">
      <span id="drawerShowing"></span>
    </div>
  </aside>

  <script type="module" src="./src/app.js?v=4"></script>
</body>
</html>
